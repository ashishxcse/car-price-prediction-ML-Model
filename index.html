<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Car Price Predictor</title>
  <style>
    :root { --bg:#f5f7fb; --card:#fff; --text:#1f2937; --muted:#6b7280; --border:#d1d5db; --accent:#2563eb; --err:#dc2626; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0f172a; --card:#1e293b; --text:#e5e7eb; --muted:#94a3b8; --border:#334155; --accent:#3b82f6; --err:#f87171; }
    }
    * { box-sizing: border-box; }
    body { margin:0; padding:24px 16px; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
    .card { max-width:560px; margin:0 auto; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:24px; }
    h1 { margin:0 0 4px; font-size:1.4rem; }
    p.sub { margin:0 0 20px; color:var(--muted); font-size:.9rem; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .full { grid-column:1 / -1; }
    label { display:block; font-size:.85rem; font-weight:600; margin-bottom:4px; }
    input, select { width:100%; padding:10px; border:1px solid var(--border); border-radius:8px; background:var(--bg); color:var(--text); font-size:.95rem; }
    input:focus, select:focus { outline:2px solid var(--accent); border-color:transparent; }
    button { width:100%; margin-top:20px; padding:12px; background:var(--accent); color:#fff; border:0; border-radius:8px; font-size:1rem; font-weight:600; cursor:pointer; }
    button:disabled { opacity:.6; cursor:wait; }
    #result { margin-top:20px; padding:16px; border-radius:8px; text-align:center; display:none; }
    #result.ok { display:block; background:var(--bg); border:1px solid var(--border); }
    #result.ok .price { font-size:1.8rem; font-weight:700; color:var(--accent); }
    #result.ok .label { color:var(--muted); font-size:.85rem; }
    #result.error { display:block; color:var(--err); border:1px solid var(--err); }
    @media (max-width:480px) { .grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div class="card">
    <h1>Car Price Predictor</h1>
    <p class="sub">Enter the car details to get an estimated resale price.</p>

    <form id="form">
      <div class="grid">
        <div class="full">
          <label for="Brand">Brand</label>
          <select id="Brand" required></select>
        </div>
        <div>
          <label for="fuel">Fuel</label>
          <select id="fuel">
            <option>Petrol</option><option>Diesel</option><option>CNG</option>
          </select>
        </div>
        <div>
          <label for="transmission">Transmission</label>
          <select id="transmission">
            <option>Manual</option><option>Automatic</option>
          </select>
        </div>
        <div>
          <label for="owner">Owner (1–4)</label>
          <input type="number" id="owner" min="1" max="4" value="1" required>
        </div>
        <div>
          <label for="car_age">Car age (years)</label>
          <input type="number" id="car_age" min="0" max="40" placeholder="e.g. 5" required>
        </div>
        <div>
          <label for="km_driven">Km driven</label>
          <input type="number" id="km_driven" min="0" placeholder="e.g. 45000" required>
        </div>
        <div>
          <label for="mileage">Mileage (kmpl)</label>
          <input type="number" id="mileage" min="0" step="0.01" placeholder="e.g. 23.4" required>
        </div>
        <div class="full">
          <label for="engine">Engine (CC)</label>
          <input type="number" id="engine" min="0" placeholder="e.g. 1248" required>
        </div>
      </div>
      <button type="submit" id="btn">Predict Price</button>
    </form>

    <div id="result"></div>
  </div>

  <script>
    // Change this if your FastAPI runs on a different host/port
    const API_URL = "http://127.0.0.1:8000/api/predict/";

    // Same brands the model saw during training
    const BRANDS = ["Ambassador","Ashok","Audi","BMW","Chevrolet","Daewoo","Datsun","Fiat","Force","Ford","Honda","Hyundai","Isuzu","Jaguar","Jeep","Kia","Land","Lexus","MG","Mahindra","Maruti","Mercedes-Benz","Mitsubishi","Nissan","Opel","Renault","Skoda","Tata","Toyota","Volkswagen","Volvo"];
    const brandSel = document.getElementById("Brand");
    BRANDS.forEach(b => brandSel.add(new Option(b, b)));
    brandSel.value = "Maruti";

    const form = document.getElementById("form");
    const btn = document.getElementById("btn");
    const result = document.getElementById("result");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      btn.disabled = true;
      btn.textContent = "Predicting...";
      result.className = "";

      const val = id => document.getElementById(id).value;
      const payload = {
        Brand: val("Brand"),
        fuel: val("fuel"),
        transmission: val("transmission"),
        owner: parseInt(val("owner")),
        km_driven: parseInt(val("km_driven")),
        mileage: parseFloat(val("mileage")),
        engine: parseFloat(val("engine")),
        car_age: parseInt(val("car_age")),
      };

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await res.json();

        if (!res.ok) {
          result.className = "error";
          result.textContent = "Error: " + JSON.stringify(data.detail || data);
        } else {
          result.className = "ok";
          result.innerHTML =
            '<div class="label">Estimated price</div>' +
            '<div class="price">₹' + Math.round(data.predicted_price).toLocaleString("en-IN") + '</div>';
        }
      } catch (err) {
        result.className = "error";
        result.textContent = "Could not reach the server. Is FastAPI running on " + API_URL + " ?";
      } finally {
        btn.disabled = false;
        btn.textContent = "Predict Price";
      }
    });
  </script>
</body>
</html>
